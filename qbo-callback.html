<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickBooks Authorization — Aetheris</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 24px; color: #1a2e2d; line-height: 1.6; }
    .card { border: 1px solid #d7e0df; border-radius: 12px; padding: 28px 28px 32px; }
    h1 { font-weight: 600; font-size: 22px; margin-top: 0; }
    pre { background: #f4f7f6; border: 1px solid #e0e8e7; border-radius: 8px; padding: 14px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
    .btn, button { display: inline-block; margin: 6px 8px 0 0; padding: 10px 16px; border-radius: 8px; border: none; background: #0a7d72; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; }
    .btn:hover, button:hover { background: #096b62; }
    .muted { color: #667; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Authorizing…</h1>
    <div id="content"></div>
  </div>
  <p class="muted">Aetheris (Hongkong) Limited · jett@aetheris.hk</p>
  <script>
    var p = new URLSearchParams(location.search);
    var code = p.get('code');
    var realmId = p.get('realmId');
    var error = p.get('error');
    var title = document.getElementById('title');
    var content = document.getElementById('content');
    if (error) {
      title.textContent = 'Authorization not completed';
      content.innerHTML = '<p>Error: ' + error.replace(/</g, '&lt;') + '. Please try the authorization link again, or contact Jett.</p>';
    } else if (code && realmId) {
      title.textContent = '✓ Connected — one last step';
      var payload = 'QuickBooks authorization code:\n' + code + '\n\nCompany (Realm) ID:\n' + realmId;
      var mail = 'mailto:jian.jettfu@gmail.com?subject=' + encodeURIComponent('QuickBooks authorization code') + '&body=' + encodeURIComponent(payload);
      content.innerHTML =
        '<p>Thank you for authorizing. Please send the details below to Jett so he can finalize the connection. (This code expires in about 10 minutes.)</p>' +
        '<pre id="payload"></pre>' +
        '<button id="copyBtn">Copy</button>' +
        '<a class="btn" href="' + mail + '">Email to Jett</a>';
      document.getElementById('payload').textContent = payload;
      document.getElementById('copyBtn').onclick = function () {
        navigator.clipboard.writeText(payload);
        this.textContent = 'Copied ✓';
      };
    } else {
      title.textContent = 'Waiting for authorization…';
      content.innerHTML = '<p>If you reached this page directly, please use the authorization link Jett sent you.</p>';
    }
  </script>
</body>
</html>
